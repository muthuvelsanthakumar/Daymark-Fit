workflows:
  android-apk:
    name: Daymark Fit Android APK
    max_build_duration: 60
    instance_type: linux

    environment:
      node: 26
      java: 17

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build Android release APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk